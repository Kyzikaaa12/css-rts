// CSS RTS test binds. In the game console type:  exec rts
// (or add +exec rts to the launch line). Safe to run again any time.
// (css_rts_public moved to cfg/sourcemod/css_rts_test.cfg, executed by the plugin: no "Unknown command" before SourceMod loads)
sv_lan 1                         // local only: no Steam auth, no master server, no VAC
sv_use_steam_networking 0        // insecure launch has no valid Steam ticket; online mode disconnects the host
sv_allow_server_adverisement_to_master_server 0
sv_cheats 1                      // test games: lets the host use noclip (also: sm_rts_noclip / !noclip)
bind F2 "sm_rts"                 // role menu, or (as Commander) toggle the command view
bind F3 "sm_commander"           // take the Commander role for your team
bind F4 "sm_rtsmenu"             // Commander / Soldier menu
bind F6 "sm_rts_debug_intel"     // print Intel + income to console
bind H "sm_rts_help"             // toggle the controls help in the HUD panel
bind MWHEELUP "sm_rts_zoom_in"   // zoom in the command view (overrides weapon wheel)
bind MWHEELDOWN "sm_rts_zoom_out"
bind mouse3 "+attack3"           // middle mouse drag = rotate / tilt camera
bind "[" "sm_rts_rotate 45"      // command view: orbit the camera around its focus
bind "]" "sm_rts_rotate -45"
bind X "sm_rts_cutaway"           // command view: cutaway (look down through roofs/ceilings)
bind LEFTARROW "+left"           // arrow keys = smooth rotate in the command view
bind RIGHTARROW "+right"
// Command view keys (no binds needed): WASD / screen edge = pan (Shift = fast), Q / E = rotate 45 deg,
// wheel = zoom, R = jump to next unit, Space = jump to base, LMB select, RMB order / cancel placement
echo "[RTS v0.5.4.3] binds loaded: F2 = command menu, F3 = take Commander, H = help, wheel = zoom, [ ] = orbit, Q/E = rotate, X = cutaway, R = next unit, Space = base"
